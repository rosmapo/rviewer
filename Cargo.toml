[package]
name = "rviewer"
version = "0.1.0"
edition = "2021"
description = "Minimal fullscreen image and video viewer for Wayland (EGL/GLES2 + GStreamer)"

[dependencies]
anyhow = "1"
libc = "0.2"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-egl = "0.32"
wayland-cursor = "0.31"
xkbcommon = "0.8"
fontdue = "0.9"
khronos-egl = { version = "6", features = ["dynamic"] }
gl = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"

[profile.release]
opt-level = 3
lto = "thin"
