# rviewer – konfigurácia (formát kľúč=hodnota ako mpv.conf)
# Umiestnenie: ~/.config/rviewer/rviewer.conf

# fullscreen=yes: celá obrazovka; fullscreen=no: okno vždy veľkosti obrázka/videa
# (väčšie ako obrazovka sa zmenší). Klávesa `f` prepína.
fullscreen=yes

# Wayland dovoľuje klientovi len zmeniť veľkosť okna, nie ho premiestniť.
# Wayfire: rviewer okno vycentruje sám cez Wayfire IPC (WAYFIRE_SOCKET), bez externého skriptu. Pri prvom
# zobrazení okno podrží (view-pre-map / unblock-map) a umiestni ho skôr, než sa objaví; pri zmene obrázka mu
# nastaví veľkosť aj polohu naraz. Mimo Wayfire sa nič nedeje. Vypnutie: wayfire-ipc=no
wayfire-ipc=yes

# Iné kompozitory (alebo vlastný spôsob): príkaz, ktorý kompozitoru zmení VEĽKOSŤ AJ POLOHU naraz (cez sh -c;
# env RVIEWER_WIDTH, RVIEWER_HEIGHT = cieľová veľkosť v logických px, RVIEWER_PID). Má prednosť pred wayfire-ipc.
# rviewer potom nový obrázok nakreslí až po odpovedi kompozitora.
#   wayfire (starší skript): window-place-command=python3 ~/.config/rviewer/wayfire-center.py   (contrib/)
window-place-command=

# Starší spôsob (okno sa najprv zmení samo a príkaz ho potom len presunie, takže môže skákať):
#   sway:      window-center-command=swaymsg move position center
#   hyprland:  window-center-command=hyprctl dispatch centerwindow
window-center-command=

# Farba pozadia: #RRGGBB alebo #AARRGGBB (rovnako ako v mpv; alfa < FF = priehľadné okno)
background=#aa000000

# Video: real = skutočná veľkosť (väčšie sa zmenší), fit = zväčší/zmenší na celú obrazovku so zachovaním
# pomeru strán. `fit` platí LEN vo fullscreene (v okne je vždy skutočná veľkosť). Klávesa `v` prepína.
# Obrázkov sa netýka.
video-fit=real

# Minimálna a maximálna veľkosť videa (platí v režime real; pomer strán sa zachová, 0 = vypnuté).
# Zápis: 1280x720 (px), 50% (šírka aj výška v % obrazovky, ako autofit v mpv), 50%x40%, alebo 1280x50%.
# Menšie video sa zväčší na minimum, väčšie sa zmenší na maximum; nikdy však nepresiahne obrazovku.
# V okne sa percentá počítajú z veľkosti obrazovky, nie okna.
video-min-size=50%
video-max-size=80%

# Hlasitosť v % (100 = bez zmeny)
volume=100

# Pri otvorení jedného súboru načítať celý adresár
autoload=yes
ignore-hidden=yes

# Súbory, ktoré sa nepodarí zobraziť/prehrať (napr. textový súbor s príponou .jpg), sa preskočia
# a vyradia zo zoznamu (hlásenie ide na stderr). no = zobrazí sa len pozadie.
skip-broken=yes

# Triedenie: name|date|size|none, s príponou -asc alebo -desc
sort=name-asc

# Skrytie kurzora po nečinnosti (ms), 0 = nikdy
cursor-autohide=500

# Filter pri zväčšení: linear | nearest
scale=linear

# Titulky (video): vložené aj externé súbory vedľa videa (film.srt, film.sk.srt, film.ass...).
# Vykresľuje ich GStreamer priamo do obrazu, takže veľkosť závisí od rozlíšenia videa.
subtitles=yes
# Preferované jazyky externých titulkov (podľa názvu súboru film.JAZYK.srt)
sub-languages=sk,cs,en
# Kódovanie textových titulkov, ak nie sú UTF-8 (staré slovenské/české .srt bývajú CP1250)
#sub-encoding=CP1250
# Písmo titulkov (pango): "Rodina Štýl Veľkosť"
sub-font=Sans Bold 14

# Náhľad snímku nad vyhľadávacou lištou pri prechode myšou (ako thumbfast v mpv). Beží druhý, ľahký
# dekodér len pre náhľady. Najdlhšia strana náhľadu v px.
thumbnails=yes
thumbnail-size=200

# Streamy z internetu: rviewer video.mp4 prehrá aj `rviewer https://.../video.mp4`, HLS (.m3u8), rtsp://...
# Adresy sa prehrávajú priamo (bez yt-dlp), takže stránky ako YouTube nefungujú.
# Buffer pri sieťovom videu v sekundách (menej = rýchlejší štart, viac = odolnejšie voči výpadkom). Prúdy bez
# trvania (rádiá) sa kvôli bufferu nepozastavujú vôbec.
net-buffer=3

# Dopredu načítať susedné obrázky na pozadí (rýchlejšie listovanie, stojí to pamäť pre 2 dekódované obrázky)
preload=yes

# Opakovať jedno video dokola (za behu prepína Ctrl+l; má prednosť pred slideshow)
loop-file=no

# Doostrenie pri zmenšení obrázka/videa, 0 (vypnuté) .. 1. Zmenšený obraz je jemnejší; 0.3-0.6 ho zdôrazní
# ako swayimg/mpv. Pri zväčšení sa nepoužije.
sharpen=0

# Vstavané skratky: yes = input.conf ich len dopĺňa/prepisuje (zmazaním riadku sa skratka NEODSTRÁNI,
# treba `SPACE ignore`), no = platí len to, čo je v input.conf.
default-bindings=yes

# Slideshow: medzerník pri obrázku (alebo `s`) ho spustí/zastaví. Obrázok sa zobrazí `slideshow-delay` sekúnd,
# video sa prehrá celé (do konca, alebo kým nedáš next) a potom pokračuje ďalší súbor.
slideshow=no
slideshow-delay=3
# Po poslednom súbore pokračovať od prvého
slideshow-loop=no

# OSD: info panel (príkaz `info`) a vyhľadávacia lišta videa (zobrazí sa pri pohybe myši,
# pauze alebo seeku; klik/ťah po lište = posun vo videu)
seekbar=yes
seekbar-timeout=500      # ms, 0 = lišta vždy viditeľná pri videu
osd-font-size=18          # logické px
osd-color=#FFFFFF
osd-accent=#E5A00D        # farba prehratej časti lišty
# Font: predvolene sa nájde cez fc-match (sans-serif), inak zadaj cestu:
#osd-font=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

# Prípony (voliteľné)
#image-extensions=jpg,jpeg,png,bmp,gif,webp,tif,tiff
#video-extensions=mkv,avi,mp4,ogv,webm,rmvb,flv,wmv,mpeg,mpg,m4v,3gp,mov,ts
