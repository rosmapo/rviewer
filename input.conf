# rviewer – skratky (formát ako mpv input.conf):  KLÁVES  príkaz [argument]
# Umiestnenie: ~/.config/rviewer/input.conf  (alebo --input-conf=SÚBOR)
# Tento súbor je zároveň predvolená sada; vlastný súbor prepíše len riadky, ktoré v ňom sú.
# Zrušenie skratky:  KLÁVES ignore
#
# Znaky (a-z, 0-9, - = [ ] ; ' ` \ , . / ...) sa berú podľa tvojho AKTUÁLNEHO rozloženia klávesnice,
# t.j. "Ctrl+=" je kláves, na ktorom máš znak '='. Pri nelatinskom rozložení (napr. ruskom) fungujú
# ako záloha aj US znaky tej istej fyzickej klávesy. Pomenované klávesy sú fyzické:
#   ESC SPACE ENTER TAB BS INS DEL HOME END PGUP PGDWN LEFT RIGHT UP DOWN F1..F12
#   KP0..KP9 KP_PLUS KP_MINUS KP_MULT KP_DIV KP_DEC KP_ENTER
#   MBTN_LEFT MBTN_MIDDLE MBTN_RIGHT WHEEL_UP WHEEL_DOWN
# Modifikátory: Ctrl+  Shift+  Alt+   (napr. Ctrl+=  alebo Shift+LEFT)
#
# Príkazy:
#   quit                  koniec
#   pause                 pauza/pokračovanie videa
#   next | prev           ďalší / predošlý súbor
#   first | last          prvý / posledný súbor
#   seek SEKUNDY          posun vo videe (záporné = dozadu)
#   seek-or-step SEKUNDY  video: posun; obrázok: ďalší (kladné) / predošlý (záporné)
#   zoom DELTA            zoom okolo kurzora v log2 (0.1 ≈ 7 %), nezmenší pod celý obsah
#   zoom-reset            pôvodné priblíženie a posun
#   volume DELTA          hlasitosť v %
#   mute                  stlmiť/zapnúť zvuk
#   info                  zapne/vypne info panel (názov, rozlíšenie, zoom, čas...)
#   cycle-sub             titulky: ďalšia stopa -> ... -> vypnuté
#   sub-delay SEKUNDY     posun titulkov (kladné = neskôr), napr. 0.1 alebo -0.1
#   cycle-fit             video: prepne skutočná veľkosť <-> zväčšenie/zmenšenie na obrazovku (fit)
#   toggle-fullscreen     prepne fullscreen <-> okno veľkosti obsahu
#   drag-pan              (len tlačidlá myši) posun obsahu ťahaním
#   ignore                nič

ESC quit
q quit
SPACE pause
MBTN_MIDDLE pause
MBTN_LEFT drag-pan
MBTN_RIGHT info
i info
WHEEL_UP prev
WHEEL_DOWN next
ENTER next
KP_ENTER next
PGDWN next
PGUP prev
HOME first
END last
LEFT seek-or-step -5
RIGHT seek-or-step 5
UP seek 60
DOWN seek -60
Ctrl+= zoom 0.1
Ctrl+- zoom -0.1
KP_PLUS zoom 0.1
KP_MINUS zoom -0.1
r zoom-reset
Ctrl+0 zoom-reset
m mute
f toggle-fullscreen
F11 toggle-fullscreen
v cycle-fit
j cycle-sub
z sub-delay -0.1
x sub-delay 0.1
9 volume -2
0 volume 2
