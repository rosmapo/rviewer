# rviewer – skratky (formát ako mpv input.conf):  KLÁVES  príkaz [argument]
# Umiestnenie: ~/.config/rviewer/input.conf  (alebo --input-conf=SÚBOR)
# Tento súbor je zároveň predvolená sada; vlastný súbor prepíše len riadky, ktoré v ňom sú.
# Zrušenie skratky:  KLÁVES ignore
#
# Znaky (a-z, 0-9, - = [ ] ; ' ` \ , . / ...) sa berú podľa tvojho AKTUÁLNEHO rozloženia klávesnice,
# t.j. "Ctrl+=" je kláves, na ktorom máš znak '='. Pri nelatinskom rozložení (napr. ruskom) fungujú
# ako záloha aj US znaky tej istej fyzickej klávesy. Pomenované klávesy sú fyzické:
#   ESC SPACE ENTER TAB BS INS DEL HOME END PGUP PGDWN LEFT RIGHT UP DOWN F1..F12
#   KP0..KP9 KP_PLUS KP_MINUS KP_MULT KP_DIV KP_DEC KP_ENTER
#   MBTN_LEFT MBTN_MIDDLE MBTN_RIGHT WHEEL_UP WHEEL_DOWN
# Modifikátory: Ctrl+  Shift+  Alt+   (napr. Ctrl+=  alebo Shift+LEFT)
#
# Príkazy:
#   quit                  koniec
#   pause                 pauza/pokračovanie videa
#   next | prev           ďalší / predošlý súbor
#   first | last          prvý / posledný súbor
#   seek SEKUNDY          posun vo videe (záporné = dozadu)
#   seek-or-step SEKUNDY  video: posun; obrázok: ďalší (kladné) / predošlý (záporné)
#   zoom DELTA            zoom okolo kurzora v log2 (0.1 ≈ 7 %), nezmenší pod celý obsah
#   zoom-reset            pôvodné priblíženie a posun
#   volume DELTA          hlasitosť v %
#   mute                  stlmiť/zapnúť zvuk
#   info                  zapne/vypne info panel (názov, rozlíšenie, zoom, čas...)
#   playlist              zoznam súborov/staníc na výber (šípky, PgUp/PgDn, Home/End, Enter prehrá, Esc zavrie, myš: kolieskom a klikom)
#   slideshow             spustí/zastaví slideshow (pri obrázku to robí aj `pause`, teda medzerník)
#   run PRÍKAZ            spustí shellový príkaz; {path} = celá cesta, {dir} = adresár, {name} = názov súboru,
#                         {stem} = názov bez prípony (hodnoty sa vkladajú ošetrené; v premennej RVIEWER_PATH je cesta)
#   run-remove PRÍKAZ     ako run a súbor navyše zmizne zo zoznamu (po presune do koša, premenovaní...)
#   cycle-sub             titulky: ďalšia stopa -> ... -> vypnuté
#   sub-delay SEKUNDY     posun titulkov (kladné = neskôr), napr. 0.1 alebo -0.1
#   speed FAKTOR          rýchlosť prehrávania vynásobí FAKTOROM (0.25..4), napr. 1.1 alebo 0.9
#   speed-reset           rýchlosť späť na 1×
#   frame-step            o jeden snímok dopredu (video sa pozastaví)
#   frame-back-step       o jeden snímok dozadu (video sa pozastaví)
#   loop-file             zapne/vypne opakovanie aktuálneho videa
#   cycle-audio           ďalšia zvuková stopa
#   cycle-fit             video: prepne skutočná veľkosť <-> zväčšenie/zmenšenie na obrazovku (fit)
#   toggle-fullscreen     prepne fullscreen <-> okno veľkosti obsahu
#   peek                  (len tlačidlá myši) kým držíš tlačidlo: skutočná veľkosť (100 %) a posun ťahaním, po pustení návrat
#   drag-pan              (len tlačidlá myši) posun obsahu ťahaním
#   ignore                nič

ESC quit
q quit
SPACE pause
Ctrl+MBTN_LEFT peek
MBTN_MIDDLE peek
MBTN_LEFT drag-pan
MBTN_RIGHT info
i info
WHEEL_UP prev
WHEEL_DOWN next
ENTER next
KP_ENTER next
PGDWN next
PGUP prev
HOME first
END last
LEFT seek-or-step -5
RIGHT seek-or-step 5
UP seek 60
DOWN seek -60
Ctrl+= zoom 0.1
Ctrl+- zoom -0.1
KP_PLUS zoom 0.1
KP_MINUS zoom -0.1
r zoom-reset
Ctrl+0 zoom-reset
m mute
f toggle-fullscreen
F11 toggle-fullscreen
v cycle-fit
j cycle-sub
a cycle-audio
[ speed 0.9
] speed 1.1
< speed 0.9
> speed 1.1
BS speed-reset
, frame-back-step
. frame-step
Ctrl+l loop-file
s slideshow
l playlist
z sub-delay -0.1
x sub-delay 0.1
9 volume -2
0 volume 2
w run /home/mm/.config/wayfire/scripts/wallpaper -v {path}
Alt+w cycle-fit
l playlist

